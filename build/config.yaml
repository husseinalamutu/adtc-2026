# Meta-config for the parts of the pipeline that aren't mlx_lm.lora's own config
# (see mlx_lora_config.yaml for the fine-tuning hyperparameters — that file's schema is
# mlx_lm's own and is consumed directly via `mlx_lm.lora --config mlx_lora_config.yaml`).
#
# Mirror any change here into metadata.json so claims match the rebuilt artifact.

base_model:
  # Logical base model (what REPORT.md cites as the foundation):
  logical_repo: "Qwen/Qwen2.5-3B-Instruct"
  logical_revision: "aa8e72537993ba99e69dfaafa59ed015b17504d1"   # pinned 2026-07-07 via HF API
  # ACTUAL QLoRA training base — a pre-quantized 4-bit MLX build of the above. Must match
  # mlx_lora_config.yaml's `model` field. Using the 4-bit base (not the bf16 original) is what
  # makes full-quality fine-tuning fit on this 8GB Mac — see mlx_lora_config.yaml's header.
  training_repo: "mlx-community/Qwen2.5-3B-Instruct-4bit"
  training_revision: "4f83f8f146fdf28b512a06562b671d7af4fab457"   # pinned 2026-07-08 (HF cache refs/main)
  training_local_dir: "models/Qwen2.5-3B-Instruct-4bit"   # get via build/download_base_4bit.sh
  family_fallback_note: "3B fits with ~3GB headroom now that the base is 4-bit; a 4B QLoRA base would likely also fit locally, but the VM speed floor (task #7) still gates the final size choice."

quantization:
  target: "Q4_K_M"
  imatrix_calibration_samples: 200   # pulled from data/out/train.jsonl by 04_imatrix_quantize.sh

runtime:
  # Mirror into metadata.json's `_runtime.model_path` and the profiler self-check.
  threads: 4
  context: 2048
  model_path: "model/alamz-tech-sme-copilot-Q4_K_M.gguf"

llamacpp:
  # llama.cpp revision used for the audited build
  # built binary (confirmed via `llama-cli --version` -> "bec4772" after the docker build).
  commit: "bec4772f6a2527d371557b5d2032641e5ff7619c"
