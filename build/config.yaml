# Meta-config for the parts of the pipeline that aren't mlx_lm.lora's own config
# (see mlx_lora_config.yaml for the fine-tuning hyperparameters — that file's schema is
# mlx_lm's own and is consumed directly via `mlx_lm.lora --config mlx_lora_config.yaml`).
#
# Mirror any change here into submission/metadata.json so claims match the rebuilt artifact.

base_model:
  # Must match mlx_lora_config.yaml's `model` field exactly.
  hf_repo: "Qwen/Qwen2.5-3B-Instruct"
  hf_revision: "aa8e72537993ba99e69dfaafa59ed015b17504d1"   # pinned 2026-07-07 via HF API
  family_fallback_note: "3B is the safe default given this Mac's 8GB unified memory (see build/README.md). Only move to a 4B model after both the VM speed floor AND a local training dry-run confirm it fits."

quantization:
  target: "Q4_K_M"
  imatrix_calibration_samples: 200   # pulled from data/out/train.jsonl by 04_imatrix_quantize.sh

runtime:
  # Mirror into submission/metadata.json's `_runtime.model_path` and the profiler self-check.
  threads: 4
  context: 2048
  model_path: "model/adtc-sme-copilot-Q4_K_M.gguf"

llamacpp:
  # Matches infra/provision_benchmark_vm.sh's LLAMACPP_COMMIT and docker/Dockerfile's
  # built binary (confirmed via `llama-cli --version` -> "bec4772" after the docker build).
  commit: "bec4772f6a2527d371557b5d2032641e5ff7619c"
